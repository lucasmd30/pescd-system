spring:
  application:
    name: pescd

  messages:
    basename: messages

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:postgresql://localhost:5432/pescd
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Armazenamento de arquivos no SeaweedFS (substitui o bytea no PostgreSQL).
# Aponta para o master server; o quick start sobe master + volume em um comando:
#   weed server -dir=./data -master.port=9333
seaweedfs:
  master-url: http://localhost:9333

server:
  port: 8082
