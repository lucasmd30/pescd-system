<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Aprovar Plano de Trabalho</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 760px;
            margin: 48px auto;
            background: white;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }

        h1 { font-size: 20px; margin: 0 0 4px; }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin: 0 0 28px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #6b7280;
            margin: 24px 0 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px;
        }

        .info-item label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: #9ca3af;
            margin-bottom: 2px;
        }

        .info-item span {
            font-size: 14px;
            color: #111827;
        }

        .pdf-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: #1976d2;
            font-size: 14px;
            font-weight: 600;
        }

        .pdf-link:hover { background: #e2e8f0; }

        .form-group { margin-top: 20px; }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        textarea:focus {
            outline: none;
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25,118,210,.15);
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 4px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            padding: 11px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary   { background: #1976d2; color: white; }
        .btn-secondary { background: #e5e7eb; color: #111827; }
        .btn-primary:hover   { background: #1565c0; }
        .btn-secondary:hover { background: #d1d5db; }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Mensagem de sucesso (após redirect) -->
    <div class="alert-success"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <h1>Aprovar Plano de Trabalho</h1>
    <p class="subtitle"
       th:text="'Aluno: ' + ${offerStudent.student.fullName}
                + ' · Oferta: ' + ${offerStudent.offer.name}">
    </p>

    <!-- Dados do plano (leitura) -->
    <div class="section-title">Dados do Plano</div>

    <div class="info-grid">
        <div class="info-item">
            <label>Código da Disciplina</label>
            <span th:text="${workPlan.disciplineCode}"></span>
        </div>
        <div class="info-item">
            <label>Nome da Disciplina</label>
            <span th:text="${workPlan.disciplineName}"></span>
        </div>
        <div class="info-item" style="grid-column: span 2;">
            <label>Curso</label>
            <span th:text="${workPlan.disciplineCourse}"></span>
        </div>
        <div class="info-item">
            <label>Enviado em</label>
            <span th:text="${#temporals.format(workPlan.submittedAt, 'dd/MM/yyyy HH:mm')}"></span>
        </div>
    </div>

    <a class="pdf-link"
       th:href="@{/professor/supervisor/ofertas/{oId}/alunos/{sId}/plano/download(oId=${offerStudent.offer.id}, sId=${offerStudent.student.id})}"
       target="_blank">
        📄 Visualizar PDF do Plano
    </a>

    <!-- Formulário de parecer -->
    <form th:action="@{/professor/supervisor/ofertas/{oId}/alunos/{sId}/aprovar-plano(oId=${offerStudent.offer.id}, sId=${offerStudent.student.id})}"
          th:object="${form}"
          method="post">

        <div class="form-group">
            <label for="parecer">Parecer do Supervisor *</label>
            <textarea id="parecer"
                      th:field="*{parecer}"
                      placeholder="Descreva seu parecer sobre o plano de trabalho...">
            </textarea>
            <p class="error"
               th:if="${#fields.hasErrors('parecer')}"
               th:errors="*{parecer}">
            </p>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">✓ Aprovar Plano</button>
            <a th:href="@{/professor/supervisor/dashboard}" class="btn btn-secondary">Cancelar</a>
        </div>

    </form>

</div>

</body>
</html>
