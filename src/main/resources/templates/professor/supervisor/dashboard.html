<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{supDashboard.title}">Supervisor — Minhas Supervisões</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 48px auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin: 4px 0 0;
            color: #6b7280;
            font-size: 14px;
        }

        .offer-block {
            margin-bottom: 32px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
        }

        .offer-header {
            background: #1976d2;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .offer-header .offer-name {
            font-size: 16px;
            font-weight: 600;
        }

        .offer-header .offer-meta {
            font-size: 13px;
            opacity: .85;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5f9;
            color: #374151;
            text-align: left;
            padding: 12px 16px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-plano_enviado      { background: #fef9c3; color: #854d0e; }
        .status-plano_aprovado     { background: #dcfce7; color: #166534; }
        .status-relatorio_enviado  { background: #fef9c3; color: #854d0e; }
        .status-relatorio_aprovado_supervisor { background: #dbeafe; color: #1d4ed8; }
        .status-concluido_responsavel         { background: #dcfce7; color: #166534; }
        .status-documentacao_enviada          { background: #fef9c3; color: #854d0e; }
        .status-nao_enviado        { background: #f3f4f6; color: #6b7280; }

        .btn {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-primary   { background: #1976d2; color: white; }
        .btn-secondary { background: #e5e7eb; color: #111827; }
        .btn-primary:hover   { background: #1565c0; }
        .btn-secondary:hover { background: #d1d5db; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state p { font-size: 15px; margin: 8px 0 0; }
    </style>
</head>
<body>

<div class="container">

    <div class="topbar">
        <div>
            <h1 th:text="#{supDashboard.heading}">Minhas Supervisões</h1>
            <p class="subtitle"
               th:text="#{supDashboard.profPrefix} + ' ' + ${professor.fullName}"></p>
        </div>
        <div style="display:flex; gap:10px;">
            <a th:href="@{/dashboard}" class="btn btn-secondary" th:text="'← ' + #{supDashboard.panel}">← Painel</a>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="btn btn-secondary" th:text="#{common.logout}">Logout</button>
            </form>
        </div>
    </div>

    <!-- Estado vazio -->
    <div class="empty-state" th:if="${#lists.isEmpty(dashboard)}">
        <strong th:text="#{supDashboard.emptyTitle}">Nenhuma supervisão encontrada.</strong>
        <p th:text="#{supDashboard.emptyText}">Você ainda não está atribuído como supervisor de nenhum aluno.</p>
    </div>

    <!-- Bloco por oferta -->
    <div class="offer-block" th:each="item : ${dashboard}">

        <div class="offer-header">
            <span class="offer-name" th:text="${item.offer.name}"></span>
            <span class="offer-meta"
                  th:text="${item.offer.semester
                           + ' · ' + #messages.msg('supDashboard.respPrefix') + ' '
                           + (item.offer.responsibleProfessor != null
                              ? item.offer.responsibleProfessor.fullName
                              : #messages.msg('common.notDefined'))}">
            </span>
        </div>

        <table>
            <thead>
            <tr>
                <th th:text="#{supDashboard.col.student}">Aluno</th>
                <th th:text="#{supDashboard.col.email}">E-mail</th>
                <th th:text="#{supDashboard.col.status}">Status</th>
                <th th:text="#{supDashboard.col.actions}">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="os : ${item.supervisedStudents}">

                <td th:text="${os.student.fullName}"></td>
                <td th:text="${os.student.email}"></td>

                <td>
                    <span class="status"
                          th:classappend="'status-' + ${#strings.toLowerCase(os.status.name())}"
                          th:text="${#messages.msg('studentStatus.' + os.status.name())}">
                    </span>
                </td>

                <td>
                    <!-- PS.02: Aprovar Plano -->
                    <a th:if="${os.status.name() == 'PLANO_ENVIADO'}"
                       th:href="@{/professor/supervisor/ofertas/{oId}/alunos/{sId}/aprovar-plano(oId=${item.offer.id}, sId=${os.student.id})}"
                       class="btn btn-primary" th:text="#{supDashboard.approvePlan}">
                        Aprovar Plano
                    </a>

                    <!-- PS.03: Aprovar Relatório -->
                    <a th:if="${os.status.name() == 'RELATORIO_ENVIADO'}"
                       th:href="@{/professor/supervisor/ofertas/{oId}/alunos/{sId}/aprovar-relatorio(oId=${item.offer.id}, sId=${os.student.id})}"
                       class="btn btn-primary" th:text="#{supDashboard.approveReport}">
                        Aprovar Relatório
                    </a>

                    <!-- Sem ação disponível -->
                    <span th:if="${os.status.name() != 'PLANO_ENVIADO'
                                   and os.status.name() != 'RELATORIO_ENVIADO'}"
                          style="color:#9ca3af; font-size:13px;">
                        —
                    </span>
                </td>

            </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
