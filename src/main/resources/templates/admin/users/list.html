<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{userList.title}">Usuários - PESCD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            max-width: 1080px;
            margin: 40px auto;
            background: #fff;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, .08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        a, button {
            text-decoration: none;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .primary {
            background: #1976d2;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .flash-success, .flash-error {
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .flash-success {
            background: #dcfce7;
            color: #166534;
        }

        .flash-error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1 th:text="#{userList.heading}">Gerenciamento de usuários</h1>
            <p th:text="#{userList.subtitle}">CRUD completo de usuários com controle de perfil e validações de acesso.</p>
        </div>
        <div class="actions">
            <a th:href="@{/admin/users/new}" class="primary" th:text="#{userList.new}">Novo usuário</a>
            <a th:href="@{/dashboard}" class="secondary" th:text="#{common.back}">Voltar</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="flash-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="flash-error" th:text="${errorMessage}"></div>

    <table>
        <thead>
        <tr>
            <th th:text="#{userList.col.fullName}">Nome completo</th>
            <th th:text="#{userList.col.email}">E-mail</th>
            <th th:text="#{userList.col.username}">Usuário</th>
            <th th:text="#{userList.col.role}">Perfil</th>
            <th th:text="#{common.actions}">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.fullName}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${#messages.msg('role.' + user.role.name())}"></td>
            <td>
                <div class="actions">
                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="secondary" th:text="#{common.edit}">Editar</a>
                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post">
                        <button type="submit" class="danger" th:disabled="${user.username == loggedUsername}"
                                th:text="#{userList.remove}">
                            Remover
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
