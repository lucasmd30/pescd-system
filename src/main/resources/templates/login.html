<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - PESCD</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 4px 16px rgba(0,0,0,.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 12px;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="login-box">

    <h2>PESCD Login</h2>

    <div
            th:if="${param.error}"
            class="error">
        Usuário ou senha inválidos
    </div>

    <div
            th:if="${param.logout}"
            class="success">
        Logout realizado com sucesso
    </div>

    <form
            th:action="@{/login}"
            method="post">

        <input
                type="text"
                name="username"
                placeholder="Usuário"
                required>

        <input
                type="password"
                name="password"
                placeholder="Senha"
                required>

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

</body>
</html>
