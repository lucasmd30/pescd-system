<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">Login - PESCD</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .1);
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 12px;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 12px;
        }

        .info {
            background: #eef4ff;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="login-box">

    <h2 th:text="#{login.heading}">PESCD Login</h2>

    <div class="info" th:text="#{login.info}">
        Use seu nome de usuário e senha para acessar as funcionalidades do seu perfil.
    </div>

    <div th:if="${param.error}" class="error" th:text="#{login.invalid}">
        Usuário ou senha inválidos.
    </div>

    <div th:if="${param.logout}" class="success" th:text="#{login.loggedOut}">
        Logout realizado com sucesso.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="text" name="username" th:placeholder="#{login.username}" placeholder="Usuário" required>
        <input type="password" name="password" th:placeholder="#{login.password}" placeholder="Senha" required>

        <button type="submit" th:text="#{login.submit}">
            Entrar
        </button>
    </form>

</div>

</body>
</html>
