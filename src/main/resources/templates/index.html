<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas do Programa - PESCD</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --ink: #111827;
            --muted: #6b7280;
            --line: #e5e7eb;
            --brand: #0f766e;
            --brand-dark: #115e59;
            --accent: #ccfbf1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--ink);
            background:
                    radial-gradient(circle at top left, #d1fae5 0, transparent 28%),
                    linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
        }

        .page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            align-items: flex-start;
            margin-bottom: 28px;
        }

        .hero-copy {
            max-width: 720px;
        }

        .eyebrow {
            display: inline-block;
            background: var(--accent);
            color: var(--brand-dark);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 42px;
            line-height: 1.1;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.6;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: bold;
            background: var(--brand);
            color: white;
        }

        .panel {
            background: var(--card);
            border: 1px solid rgba(229, 231, 235, .9);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(15, 23, 42, .08);
        }

        .panel-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .panel-header span {
            color: var(--muted);
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 16px 24px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        th {
            background: #f9fafb;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
        }

        tbody tr:hover {
            background: #fcfffe;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            background: #ecfeff;
            color: #155e75;
            font-size: 13px;
            font-weight: bold;
        }

        .empty {
            padding: 32px 24px;
            color: var(--muted);
        }

        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
            }

            .panel {
                overflow-x: auto;
            }

            h1 {
                font-size: 34px;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <section class="hero">
        <div class="hero-copy">
            <span class="eyebrow">Consulta pública de ofertas</span>
            <h1>Ofertas do programa abertas à visualização do visitante</h1>
        </div>

        <div class="hero-actions">
            <a th:href="@{/login}" class="button">Login</a>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
            <h2>Lista de ofertas</h2>
            <span>Ordenação por semestre decrescente</span>
        </div>

        <table th:if="${!#lists.isEmpty(offers)}">
            <thead>
            <tr>
                <th>Nome da oferta</th>
                <th>Semestre</th>
                <th>Data de início</th>
                <th>Data de fim</th>
                <th>Professor responsável</th>
                <th>Número de alunos matriculados</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="offer : ${offers}">
                <td th:text="${offer.name}"></td>
                <td><span class="badge" th:text="${offer.semester}"></span></td>
                <td th:text="${#temporals.format(offer.startDate, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(offer.endDate, 'dd/MM/yyyy')}"></td>
                <td th:text="${offer.responsibleProfessor}"></td>
                <td th:text="${offer.enrolledStudents}"></td>
            </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(offers)}" class="empty">
            Nenhuma oferta cadastrada no momento.
        </div>
    </section>
</div>
</body>
</html>
