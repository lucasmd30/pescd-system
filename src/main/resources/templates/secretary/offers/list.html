<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{offerList.title}">Acompanhamento de Ofertas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 48px auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1976d2;
            color: white;
            text-align: left;
            padding: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            background: #1976d2;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            transition: .2s;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }

        .btn:hover {
            background: #1565c0;
        }

        .btn.secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .flash-success, .flash-error {
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .flash-success {
            background: #dcfce7;
            color: #166534;
        }

        .flash-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1 th:text="#{offerList.heading}">Acompanhamento de Ofertas</h1>
        <div class="actions">
            <a class="btn" th:href="@{/secretary/offers/new}" th:text="#{offerList.new}">Nova oferta</a>
            <form th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="btn secondary" th:text="#{common.logout}">Logout</button>
            </form>
        </div>
    </div>

    <div th:if="${successMessage}" class="flash-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="flash-error" th:text="${errorMessage}"></div>

    <table th:if="${!#lists.isEmpty(offers)}">
        <thead>
        <tr>
            <th th:text="#{offerList.col.offer}">Oferta</th>
            <th th:text="#{offerList.col.semester}">Semestre</th>
            <th th:text="#{offerList.col.status}">Status</th>
            <th th:text="#{offerList.col.responsible}">Professor Responsável</th>
            <th th:text="#{common.actions}">Ações</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="offer : ${offers}">

            <td th:text="${offer.name}"></td>

            <td th:text="${offer.semester}"></td>

            <td>
                <span class="status" th:text="${#messages.msg('offerStatus.' + offer.status.name())}"></span>
            </td>

            <td th:text="${offer.responsibleProfessor != null ?
                         offer.responsibleProfessor.fullName :
                         #messages.msg('common.notDefined')}">
            </td>

            <td>
                <div class="actions">
                    <a class="btn" th:href="@{/secretary/offers/{id}(id=${offer.id})}" th:text="#{offerList.viewDetails}">Ver Detalhes</a>

                    <a class="btn secondary"
                       th:href="@{/secretary/offers/{id}/students(id=${offer.id})}" th:text="#{offerList.manageStudents}">Gerenciar alunos</a>

                    <form th:if="${offer.status.name() == 'AGUARDANDO_ENCERRAMENTO_SECRETARIO'}"
                          th:action="@{/secretary/offers/{id}/close(id=${offer.id})}"
                          method="post" style="display:inline;"
                          th:onsubmit="'return confirm(\'' + #{offerList.closeConfirm} + '\');'">
                        <button type="submit" class="btn" th:text="#{offerList.close}">Encerrar</button>
                    </form>
                </div>
            </td>

        </tr>
        </tbody>

    </table>

    <p th:if="${#lists.isEmpty(offers)}" th:text="#{offerList.empty}">Nenhuma oferta cadastrada. Crie a primeira oferta.</p>

</div>

</body>
</html>
