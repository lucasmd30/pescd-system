<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acompanhamento de Ofertas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 48px auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }

        h1 {
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1976d2;
            color: white;
            text-align: left;
            padding: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            background: #1976d2;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            transition: .2s;
        }

        .btn:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Acompanhamento de Ofertas</h1>

    <table>
        <thead>
        <tr>
            <th>Oferta</th>
            <th>Semestre</th>
            <th>Status</th>
            <th>Professor Responsável</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="offer : ${offers}">

            <td th:text="${offer.name}"></td>

            <td th:text="${offer.semester}"></td>

            <td>
                <span class="status"
                      th:text="${offer.status}">
                </span>
            </td>

            <td th:text="${offer.responsibleProfessor != null ?
                         offer.responsibleProfessor.fullName :
                         'Não definido'}">
            </td>

            <td>
                <a class="btn"
                   th:href="@{/secretary/offers/{id}(id=${offer.id})}">
                    Ver Detalhes
                </a>
            </td>

        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
