<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acompanhamento de Ofertas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 48px auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1976d2;
            color: white;
            text-align: left;
            padding: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            background: #1976d2;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            transition: .2s;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }

        .btn:hover {
            background: #1565c0;
        }

        .btn.secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .flash-success, .flash-error {
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .flash-success {
            background: #dcfce7;
            color: #166534;
        }

        .flash-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Acompanhamento de Ofertas</h1>
        <a class="btn" th:href="@{/secretary/offers/new}">Nova oferta</a>
    </div>

    <div th:if="${successMessage}" class="flash-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="flash-error" th:text="${errorMessage}"></div>

    <table th:if="${!#lists.isEmpty(offers)}">
        <thead>
        <tr>
            <th>Oferta</th>
            <th>Semestre</th>
            <th>Status</th>
            <th>Professor Responsável</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="offer : ${offers}">

            <td th:text="${offer.name}"></td>

            <td th:text="${offer.semester}"></td>

            <td>
                <span class="status" th:text="${offer.status.displayName}"></span>
            </td>

            <td th:text="${offer.responsibleProfessor != null ?
                         offer.responsibleProfessor.fullName :
                         'Não definido'}">
            </td>

            <td>
                <div class="actions">
                    <a class="btn" th:href="@{/secretary/offers/{id}(id=${offer.id})}">Ver Detalhes</a>

                    <a class="btn secondary"
                       th:href="@{/secretary/offers/{id}/students(id=${offer.id})}">Gerenciar alunos</a>

                    <form th:if="${offer.status.name() == 'AGUARDANDO_ENCERRAMENTO_SECRETARIO'}"
                          th:action="@{/secretary/offers/{id}/close(id=${offer.id})}"
                          method="post" style="display:inline;"
                          onsubmit="return confirm('Confirma o encerramento da oferta? Os créditos serão atribuídos aos alunos e a oferta será concluída.');">
                        <button type="submit" class="btn">Encerrar</button>
                    </form>
                </div>
            </td>

        </tr>
        </tbody>

    </table>

    <p th:if="${#lists.isEmpty(offers)}">Nenhuma oferta cadastrada. Crie a primeira oferta.</p>

</div>

</body>
</html>
