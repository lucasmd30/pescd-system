<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{offerForm.title}">Nova Oferta - PESCD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 760px;
            margin: 48px auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }

        h1 {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .field {
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .row > .field {
            flex: 1;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        a, button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        .primary {
            background: #1976d2;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .hint {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="#{offerForm.heading}">Nova oferta</h1>
    <p class="hint" th:text="#{offerForm.hint}">Se o nome não for preenchido, ele será gerado automaticamente a partir do semestre.</p>

    <form th:action="@{/secretary/offers}" th:object="${offerForm}" method="post">

        <div class="field">
            <label for="name" th:text="#{offerForm.name}">Nome da oferta</label>
            <input type="text" id="name" th:field="*{name}" th:placeholder="#{offerForm.namePlaceholder}" placeholder="Opcional">
        </div>

        <div class="field">
            <label for="semester" th:text="#{offerForm.semester}">Semestre *</label>
            <input type="text" id="semester" th:field="*{semester}" th:placeholder="#{offerForm.semesterPlaceholder}" placeholder="Ex.: 2026/1">
            <div class="error" th:if="${#fields.hasErrors('semester')}" th:errors="*{semester}"></div>
        </div>

        <div class="row">
            <div class="field">
                <label for="startDate" th:text="#{offerForm.startDate}">Data de início *</label>
                <input type="date" id="startDate" th:field="*{startDate}">
                <div class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
            </div>
            <div class="field">
                <label for="endDate" th:text="#{offerForm.endDate}">Data de fim *</label>
                <input type="date" id="endDate" th:field="*{endDate}">
                <div class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
            </div>
        </div>

        <div class="field">
            <label for="responsibleProfessorId" th:text="#{offerForm.responsible}">Professor responsável *</label>
            <select id="responsibleProfessorId" th:field="*{responsibleProfessorId}">
                <option value="" th:text="#{common.select}">Selecione...</option>
                <option th:each="professor : ${professors}"
                        th:value="${professor.id}"
                        th:text="${professor.fullName}"></option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('responsibleProfessorId')}"
                 th:errors="*{responsibleProfessorId}"></div>
        </div>

        <div class="actions">
            <button type="submit" class="primary" th:text="#{offerForm.submit}">Criar oferta</button>
            <a th:href="@{/secretary/offers}" class="secondary" th:text="#{common.cancel}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
