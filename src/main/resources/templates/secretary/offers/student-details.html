<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{studentDetails.title}">Detalhes do Aluno</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 1000px;
            margin: 48px auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }

        .card {
            margin-bottom: 24px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: #fafafa;
        }

        h1 {
            margin-bottom: 24px;
        }

        h2 {
            margin-top: 0;
        }

        p {
            margin: 10px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1976d2;
            color: white;
            text-align: left;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            background: #1976d2;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .btn:hover {
            background: #1565c0;
        }
    </style>

</head>
<body>

<div class="container">

    <h1 th:text="#{studentDetails.heading}">Detalhes do Aluno</h1>

    <div class="card">

        <h2 th:text="#{studentDetails.info}">Informações do Aluno</h2>

        <p>
            <strong th:text="#{studentDetails.label.name}">Nome:</strong>
            <span th:text="${offerStudent.student.fullName}"></span>
        </p>

        <p>
            <strong th:text="#{studentDetails.label.email}">Email:</strong>
            <span th:text="${offerStudent.student.email}"></span>
        </p>

        <p>
            <strong th:text="#{studentDetails.label.currentStatus}">Status Atual:</strong>

            <span class="status"
                  th:text="${#messages.msg('studentStatus.' + offerStudent.status.name())}">
            </span>
        </p>

    </div>

    <div class="card">

        <h2 th:text="#{studentDetails.statusHistory}">Histórico de Status</h2>

        <table>

            <thead>
            <tr>
                <th th:text="#{studentDetails.col.previousStatus}">Status Anterior</th>
                <th th:text="#{studentDetails.col.newStatus}">Novo Status</th>
                <th th:text="#{studentDetails.col.description}">Descrição</th>
                <th th:text="#{studentDetails.col.date}">Data</th>
            </tr>
            </thead>

            <tbody>

            <tr th:if="${#lists.isEmpty(logs)}">
                <td colspan="4" th:text="#{studentDetails.empty}">
                    Nenhuma alteração de status registrada.
                </td>
            </tr>

            <tr th:each="log : ${logs}">

                <td th:text="${log.previousStatus != null ? #messages.msg('studentStatus.' + log.previousStatus.name()) : '-'}"></td>

                <td th:text="${log.newStatus != null ? #messages.msg('studentStatus.' + log.newStatus.name()) : '-'}"></td>

                <td th:text="${log.description}"></td>

                <td th:text="${#temporals.format(log.changedAt,'dd/MM/yyyy HH:mm')}"></td>

            </tr>

            </tbody>

        </table>

    </div>

    <a class="btn"
       th:href="@{/secretary/offers/{id}(id=${offerStudent.offer.id})}"
       th:text="#{common.back}">
        Voltar
    </a>

</div>

</body>
</html>
