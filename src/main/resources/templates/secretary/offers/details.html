<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{offerDetails.title}">Detalhes da Oferta</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 48px auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }

        .card {
            margin-bottom: 24px;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: #fafafa;
        }

        h1 {
            margin-bottom: 24px;
        }

        h2 {
            margin-top: 0;
        }

        p {
            margin: 10px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1976d2;
            color: white;
            text-align: left;
            padding: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            background: #1976d2;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            transition: .2s;
        }

        .btn:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>

<div class="container">

    <h1 th:text="#{offerDetails.heading}">Detalhes da Oferta</h1>

    <div class="card">

        <h2 th:text="#{offerDetails.info}">Informações da Oferta</h2>

        <p>
            <strong th:text="#{offerDetails.label.name}">Nome:</strong>
            <span th:text="${offer.name}"></span>
        </p>

        <p>
            <strong th:text="#{offerDetails.label.semester}">Semestre:</strong>
            <span th:text="${offer.semester}"></span>
        </p>

        <p>
            <strong th:text="#{offerDetails.label.status}">Status:</strong>
            <span class="status"
                  th:text="${#messages.msg('offerStatus.' + offer.status.name())}">
            </span>
        </p>

        <p>
            <strong th:text="#{offerDetails.label.responsible}">Professor Responsável:</strong>
            <span th:text="${offer.responsibleProfessor != null ?
                            offer.responsibleProfessor.fullName :
                            #messages.msg('common.notDefined')}">
            </span>
        </p>

    </div>

    <div class="card">

        <h2 th:text="#{offerDetails.enrolledStudents}">Alunos Inscritos</h2>

        <p th:if="${#lists.isEmpty(students)}" th:text="#{offerDetails.empty}">Nenhum aluno inscrito nesta oferta.</p>

        <table th:if="${!#lists.isEmpty(students)}">

            <thead>
            <tr>
                <th th:text="#{offerDetails.col.student}">Aluno</th>
                <th th:text="#{offerDetails.col.status}">Status</th>
                <th th:text="#{common.actions}">Ações</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="offerStudent : ${students}">

                <td th:text="${offerStudent.student.fullName}"></td>

                <td>
        <span class="status"
              th:text="${#messages.msg('studentStatus.' + offerStudent.status.name())}">
        </span>
                </td>

                <td>
                    <a class="btn"
                       th:href="@{/secretary/offers/{offerId}/students/{offerStudentId}
           (offerId=${offer.id},
            offerStudentId=${offerStudent.id})}"
                       th:text="#{offerDetails.viewDetails}">
                        Ver Detalhes
                    </a>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

    <a class="btn" th:href="@{/secretary/offers/{id}/students(id=${offer.id})}" th:text="#{offerDetails.manageStudents}">
        Gerenciar alunos
    </a>

    <a class="btn" th:href="@{/secretary/offers}" th:text="#{common.back}">
        Voltar
    </a>

</div>

</body>
</html>
