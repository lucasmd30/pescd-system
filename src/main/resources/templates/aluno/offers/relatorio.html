<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enviar Relatório Final - PESCD</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fa; margin: 0; color: #1f2937; }
        .container { max-width: 820px; margin: 48px auto; background: #fff; border-radius: 16px;
            padding: 32px; box-shadow: 0 12px 32px rgba(15, 23, 42, .08); }
        h1 { margin-bottom: 8px; }
        h2 { margin-top: 0; }
        .subtitle { color: #6b7280; margin-bottom: 24px; }
        .card { margin-bottom: 24px; padding: 20px; border: 1px solid #e5e7eb;
            border-radius: 14px; background: #fafafa; }
        p { margin: 8px 0; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px; margin-bottom: 4px; border-radius: 8px;
            border: 1px solid #ccc; box-sizing: border-box; }
        .field { margin-bottom: 16px; }
        .error { color: #dc2626; font-size: 13px; }
        .flash-error { background: #fee2e2; color: #991b1b; border-radius: 10px;
            padding: 12px 16px; margin-bottom: 16px; }
        .status { display: inline-block; padding: 6px 12px; border-radius: 999px;
            background: #dbeafe; color: #1d4ed8; font-size: 13px; font-weight: 600; }
        .timeline { list-style: none; padding: 0; margin: 0; }
        .timeline li { padding: 8px 0; border-bottom: 1px dashed #e5e7eb; }
        .muted { color: #6b7280; font-size: 14px; }
        .actions { display: flex; gap: 12px; margin-top: 8px; }
        a, button { border: none; border-radius: 8px; padding: 12px 18px; font-size: 15px;
            text-decoration: none; cursor: pointer; display: inline-block; }
        .primary { background: #1976d2; color: white; }
        .secondary { background: #e5e7eb; color: #111827; }
    </style>
</head>
<body>
<div class="container">
    <h1>Enviar relatório final</h1>
    <p class="subtitle">Oferta: <strong th:text="${enrollment.offer.name}"></strong></p>

    <div th:if="${errorMessage}" class="flash-error" th:text="${errorMessage}"></div>

    <div class="card">
        <h2>Dados da oferta</h2>
        <p><strong>Semestre:</strong> <span th:text="${enrollment.offer.semester}"></span></p>
        <p><strong>Professor responsável:</strong>
            <span th:text="${enrollment.offer.responsibleProfessor != null
                         ? enrollment.offer.responsibleProfessor.fullName : 'Não definido'}"></span></p>
        <p><strong>Meu status:</strong>
            <span class="status" th:text="${enrollment.status.displayName}"></span></p>
    </div>

    <div class="card" th:if="${workPlan != null}">
        <h2>Plano de trabalho enviado</h2>
        <p><strong>Disciplina:</strong>
            <span th:text="${workPlan.disciplineCode + ' - ' + workPlan.disciplineName}"></span></p>
        <p><strong>Curso:</strong> <span th:text="${workPlan.disciplineCourse}"></span></p>
        <p><strong>Professor supervisor:</strong>
            <span th:text="${enrollment.supervisor != null ? enrollment.supervisor.fullName : '-'}"></span></p>
        <p><a class="secondary" th:href="@{/aluno/ofertas/{id}/plano/arquivo(id=${enrollment.id})}"
              target="_blank">Abrir PDF do plano</a></p>
    </div>

    <div class="card">
        <h2>Histórico de status</h2>
        <ul class="timeline" th:if="${!#lists.isEmpty(logs)}">
            <li th:each="log : ${logs}">
                <span th:text="${log.description}"></span>
                <span class="status" th:text="${log.newStatus.displayName}"></span>
                <span class="muted" th:text="${#temporals.format(log.changedAt, 'dd/MM/yyyy HH:mm')}"></span>
            </li>
        </ul>
        <p class="muted" th:if="${#lists.isEmpty(logs)}">Nenhuma mudança de status registrada.</p>
    </div>

    <div class="card">
        <h2>Relatório</h2>
        <form th:action="@{/aluno/ofertas/{id}/relatorio(id=${enrollment.id})}"
              th:object="${reportForm}" method="post" enctype="multipart/form-data">

            <div class="field">
                <label for="frequency">Indicador de frequência (0 a 100%) *</label>
                <input type="number" id="frequency" min="0" max="100" th:field="*{frequency}">
                <div class="error" th:if="${#fields.hasErrors('frequency')}" th:errors="*{frequency}"></div>
            </div>

            <div class="field">
                <label for="file">Arquivo do relatório (PDF, máx. 5 MB) *</label>
                <input type="file" id="file" name="file" accept="application/pdf" required>
            </div>

            <div class="actions">
                <button type="submit" class="primary">Enviar relatório</button>
                <a th:href="@{/aluno/ofertas/{id}(id=${enrollment.id})}" class="secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
