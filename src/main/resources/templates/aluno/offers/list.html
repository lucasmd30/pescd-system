<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{studentOffers.title}">Minhas Ofertas - PESCD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 48px auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1976d2;
            color: white;
            text-align: left;
            padding: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 600;
        }

        a, button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .primary {
            background: #1976d2;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .flash-success {
            background: #dcfce7;
            color: #166534;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .empty {
            color: #6b7280;
            padding: 16px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1 th:text="#{studentOffers.heading}">Minhas ofertas</h1>
            <p th:text="#{studentOffers.subtitle}">Acompanhe o status do seu estágio em cada oferta.</p>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="secondary" th:text="#{common.logout}">Logout</button>
        </form>
    </div>

    <div th:if="${successMessage}" class="flash-success" th:text="${successMessage}"></div>

    <table th:if="${!#lists.isEmpty(enrollments)}">
        <thead>
        <tr>
            <th th:text="#{studentOffers.col.offer}">Oferta</th>
            <th th:text="#{studentOffers.col.semester}">Semestre</th>
            <th th:text="#{studentOffers.col.start}">Início</th>
            <th th:text="#{studentOffers.col.end}">Fim</th>
            <th th:text="#{studentOffers.col.responsible}">Professor responsável</th>
            <th th:text="#{studentOffers.col.offerStatus}">Status da oferta</th>
            <th th:text="#{studentOffers.col.myStatus}">Meu status</th>
            <th th:text="#{common.actions}">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="enrollment : ${enrollments}">
            <td th:text="${enrollment.offer.name}"></td>
            <td th:text="${enrollment.offer.semester}"></td>
            <td th:text="${#temporals.format(enrollment.offer.startDate, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(enrollment.offer.endDate, 'dd/MM/yyyy')}"></td>
            <td th:text="${enrollment.offer.responsibleProfessor != null
                         ? enrollment.offer.responsibleProfessor.fullName : #messages.msg('common.notDefined')}"></td>
            <td><span class="status" th:text="${#messages.msg('offerStatus.' + enrollment.offer.status.name())}"></span></td>
            <td><span class="status" th:text="${#messages.msg('studentStatus.' + enrollment.status.name())}"></span></td>
            <td>
                <a class="primary" th:href="@{/aluno/ofertas/{id}(id=${enrollment.id})}" th:text="#{common.viewDetails}">Ver detalhes</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(enrollments)}" class="empty" th:text="#{studentOffers.empty}">
        Você ainda não está inscrito em nenhuma oferta.
    </p>
</div>
</body>
</html>
