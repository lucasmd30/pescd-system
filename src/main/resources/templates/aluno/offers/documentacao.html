<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{studentDoc.title}">Enviar Documentação - PESCD</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fa; margin: 0; color: #1f2937; }
        .container { max-width: 720px; margin: 48px auto; background: #fff; border-radius: 16px;
            padding: 32px; box-shadow: 0 12px 32px rgba(15, 23, 42, .08); }
        h1 { margin-bottom: 8px; }
        .subtitle { color: #6b7280; margin-bottom: 24px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px; margin-bottom: 4px; border-radius: 8px;
            border: 1px solid #ccc; box-sizing: border-box; }
        .field { margin-bottom: 16px; }
        .error { color: #dc2626; font-size: 13px; }
        .flash-error { background: #fee2e2; color: #991b1b; border-radius: 10px;
            padding: 12px 16px; margin-bottom: 16px; }
        .actions { display: flex; gap: 12px; margin-top: 8px; }
        a, button { border: none; border-radius: 8px; padding: 12px 18px; font-size: 15px;
            text-decoration: none; cursor: pointer; }
        .primary { background: #1976d2; color: white; }
        .secondary { background: #e5e7eb; color: #111827; }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="#{studentDoc.heading}">Enviar documentação comprobatória</h1>
    <p class="subtitle"><span th:text="#{studentDoc.offer}">Oferta:</span> <strong th:text="${enrollment.offer.name}"></strong></p>

    <div th:if="${errorMessage}" class="flash-error" th:text="${errorMessage}"></div>

    <form th:action="@{/aluno/ofertas/{id}/documentacao(id=${enrollment.id})}"
          th:object="${documentationForm}" method="post" enctype="multipart/form-data">

        <div class="field">
            <label for="institutionName" th:text="#{studentDoc.institutionName}">Nome da instituição onde ministrou a disciplina *</label>
            <input type="text" id="institutionName" th:field="*{institutionName}">
            <div class="error" th:if="${#fields.hasErrors('institutionName')}" th:errors="*{institutionName}"></div>
        </div>

        <div class="field">
            <label for="disciplineName" th:text="#{studentDoc.disciplineName}">Nome da disciplina *</label>
            <input type="text" id="disciplineName" th:field="*{disciplineName}">
            <div class="error" th:if="${#fields.hasErrors('disciplineName')}" th:errors="*{disciplineName}"></div>
        </div>

        <div class="field">
            <label for="disciplineCourse" th:text="#{studentDoc.disciplineCourse}">Curso da disciplina *</label>
            <input type="text" id="disciplineCourse" th:field="*{disciplineCourse}">
            <div class="error" th:if="${#fields.hasErrors('disciplineCourse')}" th:errors="*{disciplineCourse}"></div>
        </div>

        <div class="field">
            <label for="workloadHours" th:text="#{studentDoc.workloadHours}">Carga horária (em horas) *</label>
            <input type="number" id="workloadHours" min="1" th:field="*{workloadHours}">
            <div class="error" th:if="${#fields.hasErrors('workloadHours')}" th:errors="*{workloadHours}"></div>
        </div>

        <div class="field">
            <label for="file" th:text="#{studentDoc.file}">Arquivo da documentação (PDF, máx. 5 MB) *</label>
            <input type="file" id="file" name="file" accept="application/pdf" required>
        </div>

        <div class="actions">
            <button type="submit" class="primary" th:text="#{studentDoc.submit}">Enviar documentação</button>
            <a th:href="@{/aluno/ofertas/{id}(id=${enrollment.id})}" class="secondary" th:text="#{common.cancel}">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
